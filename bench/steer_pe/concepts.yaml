# Tier A.2 concept sweep — caption tag → SAM3 prompt.
# A concept runs on an image only when its tag is in the caption (the caption
# gates false grounding). ``always`` prompts run on every image regardless.
# ``absent_ok`` concepts are safe abstain negatives when their tag is missing
# from the caption (objects the booru taggers reliably list); body parts and
# generic clothing are NOT, since a missing tag does not mean absence.
threshold: 0.4
always:
  hair: hair
  eyes: eyes
  hands: hand
concepts:
  # body
  breasts: breasts
  nipples: nipple
  navel: navel
  thighs: thighs
  ass: buttocks
  legs: legs
  feet: feet
  armpits: armpit
  tongue: tongue
  penis: penis
  pussy: vulva
  # non-human parts
  animal ears: animal ears
